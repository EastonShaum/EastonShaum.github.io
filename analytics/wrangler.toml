name = "portfolio-analytics"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "portfolio-analytics"
# Paste the id printed by `npx wrangler d1 create portfolio-analytics` here.
database_id = "REPLACE_WITH_DATABASE_ID"

[triggers]
# 15:00 UTC (8 AM Mountain in winter, 9 AM in summer): the daily summary, only if there were visits.
# To also get a message after each visit, add "*/10 * * * *" here and set ALERT_VISITS = "on".
crons = ["0 15 * * *"]

[vars]
# Sites allowed to send visits (comma-separated). Other origins are ignored.
ALLOWED_ORIGINS = "https://eastonshaum.com,https://www.eastonshaum.com,https://eastonshaum.github.io,http://localhost:3000"
# Time zone used for times in Discord messages.
TIME_ZONE = "America/Denver"
# "off" = no per-visit alerts, only the daily summary.
ALERT_VISITS = "off"
# The Discord webhook is a secret, not a var:  npx wrangler secret put DISCORD_WEBHOOK
