<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">ClipForge: long-form footage on a timeline turned into a vertical captioned clip</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1206"/>
      <stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="20" fill="#d6a37a" opacity=".55">
    <text x="48" y="64">&lt;clip src="podcast-ep42.mp4" ratio="9:16"&gt;</text>
    <text x="48" y="590">&lt;/clip&gt;</text>
  </g>
  <!-- 16:9 source with timeline -->
  <g transform="translate(70 150)">
    <rect width="560" height="315" rx="14" fill="#3b1d0d" stroke="#ff9b4a" stroke-width="3"/>
    <circle cx="200" cy="140" r="56" fill="#6b3a1c"/>
    <rect x="128" y="200" width="144" height="80" rx="40" fill="#6b3a1c"/>
    <circle cx="380" cy="150" r="48" fill="#57301a"/>
    <rect x="318" y="202" width="124" height="78" rx="38" fill="#57301a"/>
    <!-- timeline -->
    <rect x="0" y="345" width="560" height="26" rx="6" fill="#3b1d0d"/>
    <rect x="12" y="352" width="70" height="12" rx="3" fill="#7a4a2a"/>
    <rect x="92" y="352" width="120" height="12" rx="3" fill="#7a4a2a"/>
    <rect x="222" y="350" width="96" height="16" rx="3" fill="#ffd166"/>
    <rect x="328" y="352" width="90" height="12" rx="3" fill="#7a4a2a"/>
    <rect x="428" y="352" width="120" height="12" rx="3" fill="#7a4a2a"/>
    <text x="270" y="405" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="18" fill="#ffd166">AI-picked moment</text>
  </g>
  <path d="M640 330 L 760 330" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
  <path d="M745 312 L 772 330 L 745 348" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 9:16 clip -->
  <g transform="translate(800 95)">
    <rect width="252" height="448" rx="26" fill="#1d1338" stroke="#c38bff" stroke-width="3"/>
    <circle cx="126" cy="190" r="62" fill="#3b2a66"/>
    <rect x="50" y="256" width="152" height="96" rx="46" fill="#3b2a66"/>
    <g font-family="'Roboto Mono', monospace" font-weight="700" font-size="24" text-anchor="middle">
      <text x="126" y="395" fill="#ffffff">that's when it</text>
      <text x="126" y="427" fill="#ffd166">CLICKED</text>
    </g>
  </g>
</svg>
