<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">LISAP: a Gmail inbox event becomes a push notification with a verification code</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="1" stop-color="#0d2a3a"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7ab6"/>
      <stop offset="1" stop-color="#5ee0c8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="20" fill="#8f86b8" opacity=".55">
    <text x="48" y="64">&lt;pipeline name="lisap"&gt;</text>
    <text x="48" y="590">&lt;/pipeline&gt;</text>
  </g>
  <!-- inbox -->
  <g transform="translate(90 170)">
    <rect width="330" height="290" rx="18" fill="#251a4a" stroke="#ff7ab6" stroke-width="3"/>
    <text x="28" y="52" font-family="'Roboto Mono', monospace" font-size="24" fill="#ff7ab6">gmail.inbox</text>
    <rect x="28" y="80" width="274" height="44" rx="8" fill="#ff7ab6" opacity=".9"/>
    <text x="44" y="109" font-family="'Roboto Mono', monospace" font-size="19" fill="#1b1035">Your sign-in code</text>
    <rect x="28" y="140" width="274" height="36" rx="8" fill="#3a2d66"/>
    <rect x="28" y="190" width="274" height="36" rx="8" fill="#3a2d66"/>
    <rect x="28" y="240" width="200" height="22" rx="6" fill="#3a2d66"/>
  </g>
  <!-- wire -->
  <path d="M430 315 C 520 315, 540 240, 600 240 S 690 315, 760 315" fill="none" stroke="url(#wire)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>
  <g font-family="'Roboto Mono', monospace" font-size="19" fill="#c9c2ee" text-anchor="middle">
    <text x="600" y="210">Pub/Sub</text>
    <text x="600" y="400">→ FCM push</text>
  </g>
  <!-- phone -->
  <g transform="translate(790 110)">
    <rect width="250" height="420" rx="36" fill="#0b1f2b" stroke="#5ee0c8" stroke-width="3"/>
    <rect x="20" y="70" width="210" height="130" rx="16" fill="#123847"/>
    <text x="38" y="104" font-family="'Roboto Mono', monospace" font-size="17" fill="#5ee0c8">LISAP · now</text>
    <text x="38" y="135" font-family="'Roboto Mono', monospace" font-size="16" fill="#cfeee8">New code for you</text>
    <text x="38" y="180" font-family="'Roboto Mono', monospace" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="4">482 913</text>
  </g>
</svg>
