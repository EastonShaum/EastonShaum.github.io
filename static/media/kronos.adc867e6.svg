<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">Kronos: a candlestick price chart with a model forecast cone extending into the future</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1f1c"/>
      <stop offset="1" stop-color="#1a1636"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" x2="1">
      <stop offset="0" stop-color="#b79cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b79cff" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="20" fill="#7fb8a8" opacity=".6">
    <text x="48" y="64">&lt;forecast model="kronos-small" horizon="24h"&gt;</text>
    <text x="48" y="590">&lt;/forecast&gt;</text>
  </g>
  <!-- grid -->
  <g stroke="#2a3f4a" stroke-width="1">
    <line x1="80" y1="170" x2="1120" y2="170"/>
    <line x1="80" y1="290" x2="1120" y2="290"/>
    <line x1="80" y1="410" x2="1120" y2="410"/>
    <line x1="80" y1="530" x2="1120" y2="530"/>
  </g>
  <!-- candles: x, wick top, wick bottom, body top, body height, color -->
  <g stroke-width="3">
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="110" y1="380" x2="110" y2="470"/><rect x="98" y="395" width="24" height="55"/></g>
    <g stroke="#ff6b8b" fill="#ff6b8b"><line x1="150" y1="370" x2="150" y2="460"/><rect x="138" y="385" width="24" height="45"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="190" y1="350" x2="190" y2="440"/><rect x="178" y="362" width="24" height="60"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="230" y1="320" x2="230" y2="400"/><rect x="218" y="335" width="24" height="45"/></g>
    <g stroke="#ff6b8b" fill="#ff6b8b"><line x1="270" y1="325" x2="270" y2="410"/><rect x="258" y="340" width="24" height="50"/></g>
    <g stroke="#ff6b8b" fill="#ff6b8b"><line x1="310" y1="345" x2="310" y2="430"/><rect x="298" y="365" width="24" height="40"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="350" y1="330" x2="350" y2="420"/><rect x="338" y="340" width="24" height="62"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="390" y1="290" x2="390" y2="370"/><rect x="378" y="300" width="24" height="52"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="430" y1="260" x2="430" y2="335"/><rect x="418" y="272" width="24" height="44"/></g>
    <g stroke="#ff6b8b" fill="#ff6b8b"><line x1="470" y1="265" x2="470" y2="345"/><rect x="458" y="280" width="24" height="42"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="510" y1="245" x2="510" y2="330"/><rect x="498" y="255" width="24" height="58"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="550" y1="225" x2="550" y2="300"/><rect x="538" y="236" width="24" height="46"/></g>
    <g stroke="#ff6b8b" fill="#ff6b8b"><line x1="590" y1="230" x2="590" y2="310"/><rect x="578" y="248" width="24" height="40"/></g>
    <g stroke="#2ee6a6" fill="#2ee6a6"><line x1="630" y1="215" x2="630" y2="295"/><rect x="618" y="226" width="24" height="50"/></g>
  </g>
  <!-- now marker -->
  <line x1="660" y1="140" x2="660" y2="540" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="672" y="160" font-family="'Roboto Mono', monospace" font-size="18" fill="#ffd166">now</text>
  <!-- forecast cone and median -->
  <path d="M660 250 L 1110 130 L 1110 340 Z" fill="url(#cone)"/>
  <path d="M660 250 C 760 238, 860 215, 1110 200" fill="none" stroke="#b79cff" stroke-width="5" stroke-linecap="round"/>
  <g font-family="'Roboto Mono', monospace" font-size="20">
    <text x="880" y="420" fill="#d9ccff">+24h forecast</text>
    <text x="880" y="452" fill="#9fd9c7">confidence 61%</text>
  </g>
</svg>
